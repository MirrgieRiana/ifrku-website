name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant the GITHUB_TOKEN the least-privilege permissions required for
# uploading a Pages artifact and deploying it.
permissions:
  contents: read
  pages:    write
  id-token: write

# Allow only one concurrent deployment; skip queued runs but do not cancel
# an in-progress deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true   # runs `bundle install` and caches gems

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Jekyll)
        run: ./gradlew jekyllBuild

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
