---
# _layouts/page.html: 固定ページ（about等）のレイアウト
layout: default
---
<div class="container">
  <article class="post">
    <!-- ページヘッダー: タイトルのみ（日付なし） -->
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
    </header>
    <!-- ページ本文: Markdownがここに展開される -->
    <div class="post-content">
      {{ content }}
    </div>
  </article>
</div>
