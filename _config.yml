title: ifrku 公式ブログ
description: >-
  ifrku の公式ブログです。開発記録、お知らせ、日常のことなどを発信します。
url: "https://mirrgierian.github.io"
baseurl: "/ifrku-website"

lang: ja
author:
  name: ifrku

# Build settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Permalinks
permalink: /:year/:month/:day/:title/

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - node_modules
  - vendor
  - build.gradle.kts
  - settings.gradle.kts
  - gradlew
  - gradlew.bat
  - gradle
  - .gradle
  - README.md
