# _config.yml — Jekyll サイト設定ファイル
#
# このファイルはJekyllの動作を制御するメインの設定ファイルです。
# サイト情報、ビルド設定、プラグイン設定などをここで管理します。

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# サイト基本情報
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
title: ifrku 公式ブログ
description: >-
  ifrku の公式ブログです。開発記録、お知らせ、日常のことなどを発信します。
# GitHub Pages の公開URL（ドメインのみ、パスなし）
url: "https://mirrgierian.github.io"
# リポジトリ名に対応するサブパス（GitHub Pages のプロジェクトサイト設定）
baseurl: "/ifrku-website"

# サイトの言語設定（日本語）
lang: ja
author:
  name: ifrku

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ビルド設定
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Markdown処理エンジン（kramdownはGFM形式に対応）
markdown: kramdown
# コードハイライトエンジン
highlighter: rouge

kramdown:
  # GitHub Flavored Markdown 形式を入力として受け付ける
  input: GFM
  # 改行をそのまま<br>にはしない（自然な日本語文章のため）
  hard_wrap: false
  syntax_highlighter: rouge

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# プラグイン設定
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
plugins:
  - jekyll-paginate   # 記事一覧のページング
  - jekyll-feed       # RSSフィード（/feed.xml）の自動生成
  - jekyll-sitemap    # サイトマップ（/sitemap.xml）の自動生成
  - jekyll-seo-tag    # SEOメタタグの自動挿入

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ページング設定
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 1ページあたりの記事表示件数
paginate: 10
# ページングURLのパターン（例: /page2/）
paginate_path: "/page:num/"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# パーマリンク設定
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 記事URLの形式（例: /2024/01/01/welcome/）
permalink: /:year/:month/:day/:title/

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ビルド対象外のファイル・ディレクトリ
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# これらはJekyllの出力（_site/）に含まれない
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - node_modules
  - vendor
  - README.md
